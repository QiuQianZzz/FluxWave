org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 修复 Kotlin 2.3.x 跨盘增量缓存崩溃（C 盘 PubCache vs D 盘 build）
# 禁用增量编译，绕过 "Could not close incremental caches / caches-jvm"
kotlin.incremental=false
# 切 in-process 执行，减少 daemon 写文件/锁竞争
kotlin.compiler.execution.strategy=in-process

# 启用代理自动检测
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890

# 关键：设置超时时间（毫秒），代理无响应时快速回退
# systemProp.http.connectionTimeout=5000
# systemProp.http.socketTimeout=5000
# systemProp.https.connectionTimeout=5000
# systemProp.https.socketTimeout=5000

# 让国内镜像不走代理（避免浪费代理流量）
systemProp.http.nonProxyHosts=*.aliyun.com|*.tencent.com|*.flutter-io.cn|*.maven.aliyun.com
systemProp.https.nonProxyHosts=*.aliyun.com|*.tencent.com|*.flutter-io.cn|*.maven.aliyun.com