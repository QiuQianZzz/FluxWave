name: Deploy Docs to Vercel

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build site
        working-directory: docs
        run: npm run build

      # 纯静态产物，直接走 Vercel CLI 三步（pull → build → deploy --prebuilt）：
      # 需要先在 Vercel 创建项目，并在仓库配置三个 Secrets：
      #   VERCEL_TOKEN      个人账户 token（Account → Settings → Tokens）
      #   VERCEL_ORG_ID     vercel org id（本地 vercel link 后取 .vercel/project.json）
      #   VERCEL_PROJECT_ID 同上
      - name: Deploy to Vercel
        working-directory: docs/.vitepress/dist
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest pull --yes --token=$VERCEL_TOKEN --environment=production
          npx vercel@latest build --yes --token=$VERCEL_TOKEN
          npx vercel@latest deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN